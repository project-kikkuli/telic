name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: ui
            tests: tests/test_ui.py
          - group: engine
            tests: tests/test_engine.py
          - group: corpus
            tests: tests/test_corpus.py tests/test_cli.py tests/test_cache.py
          - group: frontends
            tests: tests/test_rust.py tests/test_swift.py tests/test_ts_classes.py tests/test_ts_untyped.py tests/test_semantics.py tests/test_fidelity.py tests/test_frontend.py tests/test_containers.py tests/test_objects.py tests/test_json_contracts.py
          - group: core
            tests: >-
              tests --ignore=tests/test_ui.py --ignore=tests/test_engine.py --ignore=tests/test_corpus.py --ignore=tests/test_cli.py --ignore=tests/test_cache.py
              --ignore=tests/test_rust.py --ignore=tests/test_swift.py --ignore=tests/test_ts_classes.py --ignore=tests/test_ts_untyped.py --ignore=tests/test_semantics.py
              --ignore=tests/test_fidelity.py --ignore=tests/test_frontend.py --ignore=tests/test_containers.py --ignore=tests/test_objects.py --ignore=tests/test_json_contracts.py
    name: test (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telic/lean/lean-toolchain') }}
      - name: Install Lean 4 (the toolchain pinned in telic/lean/lean-toolchain)
        run: |
          test -x ~/.elan/bin/elan || curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none --no-modify-path
          ~/.elan/bin/elan toolchain install "$(cat telic/lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install
        run: |
          pip install -e '.[test]'
          (cd telic/frontend/ts && npm ci)
          sudo apt-get install -y z3
      - name: Playwright version
        id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium for the UI tests
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = true ]; then python -m playwright install-deps chromium; else python -m playwright install --with-deps chromium; fi
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      - name: Build the native engine
        run: opam exec -- make -C core
      - name: Use every core
        run: echo "TELIC_JOBS=$(nproc)" >> "$GITHUB_ENV" && echo "TELIC_MAX_JOBS=$(nproc)" >> "$GITHUB_ENV"
      - name: Swift toolchain (the runner image ships one; replay tests skip without it)
        run: swiftc --version || echo "no swiftc on this runner"
      - name: Test
        run: pytest -q -rs --durations=25 ${{ matrix.tests }}
        env:
          TELIC_UI_SLOTS: "2"
      - name: Demo
        if: matrix.group == 'core'
        run: telic demo --no-pause --color never
