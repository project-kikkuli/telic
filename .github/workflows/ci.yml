name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      record:
        description: Construct a proof baseline artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      RECORD: ${{ inputs.record }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain identity
        run: |
          echo "TELIC_CI_ID=$ImageVersion python=3.11 node=22 ocaml=5.2 $(apt-cache policy z3 | sed -n 's/ *Candidate: /z3=/p')" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        with:
          path: .telic
          key: evidence-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: evidence-v1-${{ runner.os }}-
      - name: Select changed evidence
        id: plan
        run: |
          if [ "$RECORD" = true ]; then
            python3 scripts/ci.py --plan --record
          else
            python3 scripts/ci.py --plan
          fi
      - if: steps.plan.outputs.needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: steps.plan.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: steps.plan.outputs.needed == 'true'
        uses: astral-sh/setup-uv@v6
      - name: Install verifier
        if: steps.plan.outputs.needed == 'true'
        run: |
          uv venv .venv
          uv pip install -e '.[test]' -c .github/constraints.txt
          npm ci --prefix telic/frontend/ts
      - if: steps.plan.outputs.native == 'true'
        uses: actions/cache/restore@v4
        id: native
        with:
          path: core/telic-core
          key: core-${{ runner.os }}-${{ env.TELIC_CI_ID }}-${{ hashFiles('core/*.ml', 'core/Makefile') }}
      - if: steps.plan.outputs.native == 'true' && steps.native.outputs.cache-hit != 'true'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      - name: Install native solver
        if: steps.plan.outputs.native == 'true'
        run: sudo apt-get install -y z3
      - name: Build native engine
        if: steps.plan.outputs.native == 'true' && steps.native.outputs.cache-hit != 'true'
        run: opam exec -- make -C core
      - name: Preserve native build
        if: steps.plan.outputs.native == 'true' && steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: core/telic-core
          key: ${{ steps.native.outputs.cache-primary-key }}
      - if: steps.plan.outputs.lean == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('telic/lean/lean-toolchain') }}
      - name: Install pinned Lean
        if: steps.plan.outputs.lean == 'true'
        run: |
          test -x ~/.elan/bin/elan || curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none --no-modify-path
          ~/.elan/bin/elan toolchain install "$(cat telic/lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check proofs and changed verifier semantics
        if: steps.plan.outputs.needed == 'true'
        run: |
          TELIC_JOBS=$(nproc)
          TELIC_MAX_JOBS=$TELIC_JOBS
          export TELIC_JOBS TELIC_MAX_JOBS
          if [ "$RECORD" = true ]; then
            .venv/bin/python scripts/ci.py --record
          else
            .venv/bin/python scripts/ci.py --since "$BASE"
          fi
      - name: Export constructed baseline
        if: inputs.record
        uses: actions/upload-artifact@v4
        with:
          name: proof-baseline
          path: telic.ledger.json
      - name: Preserve evidence
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: .telic
          key: evidence-v1-${{ runner.os }}-${{ github.sha }}
