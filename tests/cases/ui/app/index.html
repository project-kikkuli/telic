<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jot</title>
<style>
  body { margin: 0; font: 16px system-ui, sans-serif; }
  body.dark { background: #111; color: #eee; }
  header { position: fixed; top: 0; left: 0; right: 0; height: 48px; display: flex; gap: 8px; align-items: center; padding: 0 8px; background: #eef; }
  main { padding: 64px 12px 12px; }
  [role=menu] { position: fixed; top: 48px; left: 8px; background: white; border: 1px solid #999; display: flex; flex-direction: column; }
  .banner { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: #fd0; padding: 8px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: grid; place-items: center; }
  .modal > div { background: white; padding: 16px; }
</style>
</head>
<body>
<header>
  <button id="menu-button" aria-haspopup="menu" aria-expanded="false">Menu</button>
  <button id="settings-button">Settings</button>
  <button id="help-button">Help</button>
</header>
<main id="main"></main>
<dialog id="settings" aria-labelledby="settings-title">
  <h2 id="settings-title">Settings</h2>
  <label><input type="checkbox" id="dark"> Dark mode</label>
  <button id="settings-close">Close</button>
</dialog>
<script src="bugs.js"></script>
<script src="app.js"></script>
</body>
</html>
