[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telic"
version = "0.1.0"
description = "Contracts in comments, checked by proof: a static verifier for Python, TypeScript, Rust and Swift."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["z3-solver>=4.12", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
rust = ["tree-sitter>=0.23", "tree-sitter-rust>=0.23"]
swift = ["tree-sitter>=0.23", "tree-sitter-swift>=0.7"]
ui = ["playwright>=1.49"]
test = ["pytest>=7", "tree-sitter>=0.23", "tree-sitter-rust>=0.23", "tree-sitter-swift>=0.7", "playwright>=1.49"]

[project.scripts]
telic = "telic.cli:main"

[tool.setuptools.packages.find]
include = ["telic*"]

[tool.setuptools.package-data]
telic = ["frontend/ts/*.mjs", "frontend/ts/package.json", "frontend/ts/package-lock.json", "lean/*.lean", "lean/lean-toolchain", "demo/scenario/**/*"]
